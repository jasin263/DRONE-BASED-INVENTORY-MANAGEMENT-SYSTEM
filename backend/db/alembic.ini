[alembic]
sqlalchemy.url = postgresql+psycopg://drims:drims_password@postgres:5432/drims
script_location = backend/db/alembic

[loggers]
keys = root

[logger_root]
level = WARN
handlers = console

[handlers]
keys = console

[formatters]
keys = generic

[formatter_generic]
format = %(asctime)s %(levelname)s %(name)s %(message)s
datefmt = %Y-%m-%d %H:%M:%S

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic
level = INFO
